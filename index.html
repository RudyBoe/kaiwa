<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaiwa</title>
<meta name="description" content="Practise Japanese dialogues and short stories aloud, alone or with a partner. Works offline.">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" crossorigin>
<link rel="stylesheet" href="style.css?v=1">
<script>
  // Apply the saved theme before the first paint.
  try { var t = JSON.parse(localStorage.getItem("kaiwa:settings") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script type="module" src="app.js?v=1"></script>
</head>
<body>
<main class="wrap" id="view"><p class="hint">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">Kaiwa needs JavaScript.</p></noscript>
</body>
</html>
